[project]
name = "music-ai-lab"
version = "0.1.0"
description = "Hands-on experiments for learning music information retrieval and generative music models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "mido>=1.3.3",
    "numpy>=2.3.0",
    "pretty-midi>=0.2.11",
    "soundfile>=0.13.1",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "jupyterlab>=4.5.3",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["learning", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
